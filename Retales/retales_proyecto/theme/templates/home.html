{% extends "base.html" %}

{% block content %}
<section class="text-center py-16">
    <h1 class="text-4xl font-bold">Retales</h1>
    <p class="mt-4 text-gray-600">Tus proyectos de punto, ganchillo y bordado en la nube.</p>
    <div class="mt-8 flex justify-center gap-3">
        {% if user.is_authenticated %}
            <a href="{% url 'proyecto_list' user.username %}" class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">Mis proyectos</a>
        {% else %}
            <a href="{% url 'registro' %}" class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">Crear cuenta</a>
        {% endif %}
        <a href="{% url 'busqueda' %}" class="rounded-lg border border-gray-300 px-4 py-2 hover:bg-white">Explorar proyectos</a>
    </div>
</section>
{% endblock %}
