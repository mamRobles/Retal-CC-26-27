{% extends "base.html" %}

{% block title %}Borrar proyecto{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm p-6">
    <h1 class="text-xl font-bold">¿Borrar «{{ proyecto.titulo }}»?</h1>
    <p class="mt-2 text-gray-600">Esta acción no se puede deshacer.</p>
    <form method="post" class="mt-6 flex gap-3">
        {% csrf_token %}
        <button type="submit" class="rounded-lg bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700">Sí, borrar</button>
        <a href="{{ proyecto.get_absolute_url }}" class="rounded-lg border border-gray-300 px-4 py-2 hover:bg-gray-50">Cancelar</a>
    </form>
</div>
{% endblock %}
