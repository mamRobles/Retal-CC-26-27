{% extends "base.html" %}

{% block title %}Borrar proyecto{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-sm p-6">
    <h1 class="text-xl font-bold">¿Borrar «{{ proyecto.titulo }}»?</h1>
    <p class="mt-2 text-gray-600">Esta acción no se puede deshacer.</p>
    <form method="post" class="mt-6 flex gap-3">
        {% csrf_token %}
        <button type="submit" class="btn-estrellas btn-estrellas--peligro">Sí, borrar{% include "_estrellas.html" %}</button>
        <a href="{{ proyecto.get_absolute_url }}" class="rounded-lg border-2 border-copperwood px-4 py-2 text-black-forest hover:bg-sunlit-clay/25">Cancelar</a>
    </form>
</div>
{% endblock %}
