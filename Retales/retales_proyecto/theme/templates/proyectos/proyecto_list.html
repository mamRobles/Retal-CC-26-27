{% extends "base.html" %}

{% block title %}Proyectos de {{ propietario.username }}{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Proyectos de {{ propietario.username }}</h1>
    {% if es_propietario %}
        <a href="{% url 'proyecto_agregar' propietario.username %}" class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">Nuevo proyecto</a>
    {% endif %}
</div>

{% include "proyectos/_lista.html" %}
{% endblock %}
